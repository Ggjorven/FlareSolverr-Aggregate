services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - PORT=8192
    restart: unless-stopped

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    environment:
      - LOG_LEVEL=info
      - PORT=8193
    restart: unless-stopped

  flaresolverr-aggregate:
    image: ghcr.io/ggjorven/flaresolverr-aggregate:latest
    container_name: flaresolverr-aggregate
    environment:
      - LOG_LEVEL=info
      - FLARESOLVERR_URL=http://flaresolverr:8192/v1
      - BYPARR_URL=http://byparr:8193/v1
    ports:
      - 8191:8191
    depends_on:
      - flaresolverr
      - byparr
    # HEALTHCHECK is in Dockerfile
    restart: unless-stopped

