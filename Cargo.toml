[package]
name = "flaresolverr_aggregate"
description = "flaresolverr_aggregate is an application for aggregating multiple cloudflare solvers."
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ggjorven/FlareSolverr-Aggregate"

[dependencies]
colored = "3.1"
thiserror = "2"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_url_params = "0.2"
serde_qs = "1.1"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
url = { version = "2", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "charset", "http2", "system-proxy"] }
